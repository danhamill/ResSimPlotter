[project]
name = "ressimplotter"
version = "0.1.0"
description = "A Python package for reservoir simulation plotting and visualization"
authors = [
    { name = "Daniel Hamill", email = "daniel.d.hamill@USACE.army.mil" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "altair>=5.0",
    "hecdss>=0.1.28",
    "numpy>=1.20",
    "pandas>=1.3",
    "vl-convert-python>=1.0",
]

[dependency-groups]
dev = [
    "black>=22.0.0,<23",
    "flake8>=4.0.0,<5",
    "mypy>=0.950,<0.951",
    "pytest>=7.0.0,<8",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ressimplotter"
module-root = ""
source-include = ["examples/**"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
